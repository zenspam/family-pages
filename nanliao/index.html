<h1>風城的港口</h1>
<p class="sub">新竹南寮漁港，從竹塹港到十七公里海岸線 · 2 分 14 秒</p>
<video controls playsinline preload="metadata" src="nanliao_720p.mp4"></video>
<p>三百年前，竹塹港是西海岸的貿易口；泥沙一次次把港口填淺，港也一次次搬家。到了今天，這裡有九降風吹乾的米粉和柿餅、走得到海邊的魚鱗天梯、騎得到香山濕地的海岸線、秋天的風箏節，和夕陽後亮起來的市集。港口換了位置，風一直都在。</p>
<p>每一條線都是用程式畫出來的，配樂和海浪、海鷗的聲音也是。</p>
<p class="src">資料來源：維基百科「新竹漁港」「舊港 (新竹)」「九降風」；新竹市地方寶藏資料庫〈從舊港到南寮〉；新竹市政府國際風箏節。</p>
