  <script>
    // =========================================================================
    // 確定性隨機數生成器與雜湊 (Strictly Deterministic / No Math.random)
    // =========================================================================
    function createMulberry32(seed) {
      let a = seed >>> 0;
      return function() {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hashCoord(x, y, seed = 101) {
      const n = Math.sin(x * 12.9898 + y * 78.233 + seed * 37.719) * 43758.5453;
      return n - Math.floor(n);
    }

    // =========================================================================
    // 構圖幾何與常數 (基準解析度 1280 x 720)
    // =========================================================================
    const BASE_W = 1280;
    const BASE_H = 720;
    const HORIZON_Y = 412;

    // 遠山幾何路徑 (3 層層次分明山脈)

        color: '#42456c',

        ],

    // 迎風斜松骨幹幾何與針葉團塊
    const PINE_TRUNK_PATH = [

    const PINE_BRANCHES = [

      [[710, 355], [680, 310], [630, 280], [580, 270]],

    // 松針雲片狀針葉團 (Tiered Matsu Pads)
    const PINE_PADS = [
      { x: 490, y: 335, rx: 50, ry: 28, rot: -0.15 },
      { x: 550, y: 315, rx: 55, ry: 30, rot: -0.10 },
      { x: 575, y: 265, rx: 48, ry: 26, rot: -0.22 },
      { x: 635, y: 275, rx: 54, ry: 30, rot: -0.05 },
      { x: 685, y: 305, rx: 58, ry: 32, rot: 0.10 },
      { x: 615, y: 440, rx: 52, ry: 28, rot: 0.16 },
      { x: 680, y: 425, rx: 50, ry: 28, rot: 0.12 },
      { x: 740, y: 380, rx: 60, ry: 34, rot: 0.05 },
      { x: 800, y: 350, rx: 54, ry: 30, rot: -0.10 },
      { x: 920, y: 365, rx: 50, ry: 28, rot: 0.18 },
      { x: 990, y: 360, rx: 46, ry: 26, rot: 0.15 }
    ];

    // 前景草坡路徑
    const GRASS_HILL_PATH = [
      [820, 720], [860, 680], [920, 630], [990, 585],
      [1080, 550], [1180, 525], [1280, 510], [1280, 720]
    ];

    // 確定性草葉資料
    const GRASS_BLADES = [];
    {
      const rng = createMulberry32(8899);
      for (let i = 0; i < 90; i++) {
        const u = i / 89;
        const x = 835 + u * 440 + (rng() - 0.5) * 16;
        const hillY = 690 - u * 175 + (rng() - 0.5) * 10;
        const length = 28 + rng() * 40;
        const baseAngle = -Math.PI / 2 + (rng() - 0.5) * 0.7 - 0.25;
        const swayFreq = 2.5 + rng() * 1.6;
        const swayPhase = rng() * Math.PI * 2;
        const width = 1.8 + rng() * 1.6;
        GRASS_BLADES.push({ x, y: hillY, length, baseAngle, swayFreq, swayPhase, width });
      }
    }

    // 沙灘海岸弧線 (Sweep shoreline)
    const BEACH_SHORELINE = [
      [0, 530], [180, 545], [360, 565], [540, 590],
      [720, 620], [900, 655], [1060, 690], [1160, 720]
    ];

    // 天空色塊帶
    const SKY_BANDS = [
      { y0: 0,   y1: 65,  c: '#2b3154' },
      { y0: 60,  y1: 125, c: '#393d6b' },
      { y0: 120, y1: 185, c: '#524b7a' },

      { y0: 380, y1: 413, c: '#fa9d52' }
    ];

    // 橙粉雲彩色塊
    const CLOUD_BLOCKS = [
      { poly: [[80, 110], [280, 105], [420, 115], [380, 132], [220, 135], [70, 125]], color: '#8c5e88' },
      { poly: [[480, 140], [740, 130], [890, 142], [820, 158], [630, 160], [470, 152]], color: '#9f648b' },
      { poly: [[40, 205], [260, 195], [460, 208], [420, 230], [210, 232], [30, 222]], color: '#d66770' },
      { poly: [[250, 218], [430, 212], [540, 222], [500, 238], [340, 240], [240, 230]], color: '#e77b6e' },
      { poly: [[580, 220], [860, 205], [1080, 225], [1010, 248], [790, 252], [560, 240]], color: '#df6e72' },
      { poly: [[90, 280], [330, 270], [520, 285], [470, 310], [260, 312], [80, 298]], color: '#f08562' },
      { poly: [[140, 298], [320, 292], [420, 302], [390, 318], [240, 320], [130, 310]], color: '#fba564' },
      { poly: [[540, 295], [820, 285], [980, 300], [930, 325], [730, 328], [520, 315]], color: '#e97e68' },
      { poly: [[160, 312], [300, 308], [380, 316], [360, 326], [220, 328], [150, 322]], color: '#fed485' },
      { poly: [[600, 320], [780, 312], [880, 322], [850, 332], [710, 335], [580, 328]], color: '#fdbd73' }
    ];

    // 海洋色塊層 (完全鋪滿水面無空隙)
    const SEA_BANDS = [
      { y0: 412, y1: 435, c: '#162d47' },
      { y0: 432, y1: 462, c: '#193959' },
      { y0: 458, y1: 495, c: '#1b4b6f' },
      { y0: 490, y1: 535, c: '#1e5f7e' },
      { y0: 530, y1: 585, c: '#237890' },
      { y0: 580, y1: 720, c: '#28889c' }
    ];

    // =========================================================================
    // 鉛筆手繪線條函式
    // =========================================================================
    function drawPencilPolyline(ctx, pts, progress, seed, opt = {}) {
      if (progress <= 0 || pts.length < 2) return;
      
      const totalSegments = pts.length - 1;
      const targetSegments = totalSegments * progress;
      const fullSegs = Math.floor(targetSegments);
      const fracSeg = targetSegments - fullSegs;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const passes = [
        { alpha: 0.35, width: (opt.width || 1.8) * 1.3, offset: 0.6, color: 'rgba(55, 50, 46, ' },
        { alpha: 0.85, width: opt.width || 1.6, offset: 0.2, color: 'rgba(38, 34, 30, ' }
      ];

      for (const pass of passes) {
        ctx.beginPath();
        let started = false;

        for (let i = 0; i <= fullSegs && i < pts.length; i++) {
          let px = pts[i][0];
          let py = pts[i][1];
          const jx = (hashCoord(px, py, seed + pass.offset) - 0.5) * 1.4;
          const jy = (hashCoord(py, px, seed + pass.offset + 7) - 0.5) * 1.4;
          px += jx;
          py += jy;

          if (!started) {
            ctx.moveTo(px, py);
            started = true;
          } else {
            ctx.lineTo(px, py);
          }
        }

        if (fracSeg > 0 && fullSegs < totalSegments) {
          const p0 = pts[fullSegs];
          const p1 = pts[fullSegs + 1];
          let px = p0[0] + (p1[0] - p0[0]) * fracSeg;
          let py = p0[1] + (p1[1] - p0[1]) * fracSeg;
          const jx = (hashCoord(px, py, seed + 13) - 0.5) * 1.4;
          const jy = (hashCoord(py, px, seed + 27) - 0.5) * 1.4;
          ctx.lineTo(px + jx, py + jy);
        }

        ctx.strokeStyle = pass.color + pass.alpha + ')';
        ctx.lineWidth = pass.width;
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawPencilHatching(ctx, x0, y0, w, h, angle, spacing, progress, seed) {
      if (progress <= 0) return;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x0, y0, w, h);
      ctx.clip();

      const numLines = Math.floor((w + h) / spacing);
      const drawCount = Math.floor(numLines * progress);

      ctx.strokeStyle = 'rgba(45, 40, 36, 0.45)';
      ctx.lineWidth = 1.1;

      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);

      for (let i = 0; i < drawCount; i++) {
        const offset = i * spacing;
        const lx0 = x0 - h * cosA + offset * sinA;
        const ly0 = y0 + offset * cosA;
        const lx1 = lx0 + (w + h) * cosA;
        const ly1 = ly0 + (w + h) * sinA;

        ctx.beginPath();
        const j = (hashCoord(i, seed) - 0.5) * 2;
        ctx.moveTo(lx0 + j, ly0);
        ctx.lineTo(lx1 + j, ly1);
        ctx.stroke();
      }

      ctx.restore();
    }

    // =========================================================================
    // 繪製松樹鉛筆素描線 (供底稿或未上色階段調用)
    // =========================================================================
    function drawPineSketch(ctx, progress) {
      if (progress <= 0) return;

      function getSub(s0, s1) {
        if (progress <= s0) return 0;
        if (progress >= s1) return 1;
        return (progress - s0) / (s1 - s0);
      }

      const pTrunk = getSub(0.0, 0.55);
      if (pTrunk > 0) {
        drawPencilPolyline(ctx, PINE_TRUNK_PATH, pTrunk, 404, { width: 2.4 });
        const off1 = PINE_TRUNK_PATH.map(pt => [pt[0] - 5, pt[1]]);
        const off2 = PINE_TRUNK_PATH.map(pt => [pt[0] + 5, pt[1]]);
        drawPencilPolyline(ctx, off1, pTrunk, 405, { width: 1.2 });
        drawPencilPolyline(ctx, off2, pTrunk, 406, { width: 1.2 });
      }

      const pBranches = getSub(0.35, 0.75);
      if (pBranches > 0) {
        for (let bIdx = 0; bIdx < PINE_BRANCHES.length; bIdx++) {
          drawPencilPolyline(ctx, PINE_BRANCHES[bIdx], pBranches, 450 + bIdx * 20, { width: 1.6 });
        }
      }

      const pPads = getSub(0.55, 1.0);
      if (pPads > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(42, 38, 34, 0.78)';
        ctx.lineWidth = 1.3;
        const drawCount = Math.floor(PINE_PADS.length * pPads);
        for (let c = 0; c < drawCount; c++) {
          const pad = PINE_PADS[c];
          ctx.beginPath();
          const steps = 18;
          for (let st = 0; st <= steps; st++) {
            const ang = (st / steps) * Math.PI * 2;
            const rJitter = (hashCoord(c, st) - 0.5) * 6;
            const px = pad.x + Math.cos(ang) * (pad.rx + rJitter);
            const py = pad.y + Math.sin(ang) * (pad.ry + rJitter * 0.6);
            if (st === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          const needles = 10;
          for (let n = 0; n < needles; n++) {
            const ang = (n / needles) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(pad.x + Math.cos(ang) * (pad.rx * 0.4), pad.y + Math.sin(ang) * (pad.ry * 0.4));
            ctx.lineTo(pad.x + Math.cos(ang) * (pad.rx * 0.95), pad.y + Math.sin(ang) * (pad.ry * 0.95));
            ctx.stroke();
          }
        }
        ctx.restore();
      }
    }

    // =========================================================================
    // 繪製素描底稿 (t = 0 ~ 1.5s 逐漸勾勒)
    // =========================================================================
    function drawSketchUnderdrawing(ctx, sProgress) {
      if (sProgress <= 0) return;

      function getSubProgress(sStart, sEnd) {
        if (sProgress <= sStart) return 0;
        if (sProgress >= sEnd) return 1;
        return (sProgress - sStart) / (sEnd - sStart);
      }

      // 1. 地平線素描 (s: 0.0 ~ 0.20 -> t=0.5s 即 s=0.33 時已 100% 完成)
      const pHorizon = getSubProgress(0.0, 0.20);
      if (pHorizon > 0) {
        drawPencilPolyline(ctx, [[0, HORIZON_Y], [860, HORIZON_Y]], pHorizon, 101, { width: 1.8 });
      }

      // 2. 遠山素描 (s: 0.12 ~ 0.48 -> t=0.5s 時遠山正被勾勒出來)
      for (let mIdx = 0; mIdx < MOUNTAINS.length; mIdx++) {
        const m = MOUNTAINS[mIdx];
        const pM = getSubProgress(0.12 + mIdx * 0.10, 0.32 + mIdx * 0.12);
        if (pM > 0) {
          drawPencilPolyline(ctx, m.pts, pM, 202 + mIdx * 50, { width: 1.7 });
          if (mIdx === 0 && pM > 0.4) {
            drawPencilHatching(ctx, 670, 310, 160, 95, -0.65, 7, pM, 333);
          }
        }
      }

      // 3. 迎風斜松樹幹與松針 (s: 0.28 ~ 0.75 -> t=0.5s 時主幹正被勾勒出來)
      const pPine = getSubProgress(0.28, 0.75);
      if (pPine > 0) {
        drawPineSketch(ctx, pPine);
      }

      // 4. 沙岸弧線與浪線 (s: 0.70 ~ 0.92 -> t=0.5s 時未繪出)
      const pBeach = getSubProgress(0.70, 0.92);
      if (pBeach > 0) {
        drawPencilPolyline(ctx, BEACH_SHORELINE, pBeach, 601, { width: 1.8 });
        const wave1 = BEACH_SHORELINE.map(pt => [pt[0], pt[1] - 40]);
        const wave2 = BEACH_SHORELINE.map(pt => [pt[0], pt[1] - 80]);
        drawPencilPolyline(ctx, wave1, pBeach, 602, { width: 1.4 });
        drawPencilPolyline(ctx, wave2, pBeach, 603, { width: 1.2 });
      }

      // 5. 前景草坡 (s: 0.82 ~ 1.00 -> t=0.5s 時未繪出)
      const pGrass = getSubProgress(0.82, 1.00);
      if (pGrass > 0) {
        drawPencilPolyline(ctx, GRASS_HILL_PATH, pGrass, 701, { width: 2.0 });
        drawPencilHatching(ctx, 920, 580, 360, 140, -0.75, 8, pGrass, 702);
      }
    }

    // =========================================================================
    // 核心繪製函式：renderScene(ctx, width, height, t)
    // =========================================================================
    function renderScene(ctx, width, height, t) {
      t = Math.max(0, t);

      ctx.save();
      ctx.clearRect(0, 0, width, height);
      ctx.scale(width / BASE_W, height / BASE_H);

      // 1. 米白紙底 (Cream / Off-white paper base)
      ctx.fillStyle = '#f7f3e8';
      ctx.fillRect(0, 0, BASE_W, BASE_H);

      // 紙面細微纖維點
      ctx.fillStyle = 'rgba(70, 60, 50, 0.035)';
      for (let i = 0; i < 180; i++) {
        const px = hashCoord(i, 11) * BASE_W;
        const py = hashCoord(i, 23) * BASE_H;
        ctx.fillRect(px, py, 1.6, 1.2);
      }

      // 2. 繪製鉛筆素描底稿 (在 t=0~1.5s 時勾勒；在 t>1.5s 底稿已全成)
      const sketchT = Math.min(1.5, t);
      const sProgress = sketchT / 1.5;
      drawSketchUnderdrawing(ctx, sProgress);

      // =======================================================================
      // 分層塊面色彩繪製 (Color Phase: t = 1.5s ~ 4.0s 進行上色)
      // =======================================================================
      const colorP = Math.max(0, Math.min(1.0, (t - 1.5) / 2.5));

      // 若尚未開始上色 (t <= 1.5s)，純素描展示完畢直接返回
      if (colorP <= 0) {
        ctx.restore();
        return;
      }

      // 輔助函式：計算各層上色率
      function getLayerFill(pStart, pEnd) {
        if (colorP <= pStart) return 0;
        if (colorP >= pEnd) return 1;
        return (colorP - pStart) / (pEnd - pStart);
      }

      // 動態參數 (t >= 4.0 秒後持續運作)
      const sunSink = (t >= 4.0) ? Math.min(1.0, (t - 4.0) / 9.0) * 18 : 0;
      const sunCenterX = 240;
      const sunCenterY = 388 + sunSink;

      // 潮浪週期 (8 秒完整大循環)
      // t = 8.0s: cyclePhase = 0.25 -> shoreSurge = 1.0 (浪推上灘頭最頂端，白沫大量散開)
      // t = 12.0s: cyclePhase = 0.75 -> shoreSurge = 0.0 (浪完全退到底，沙灘退潮露出濕沙)
      const waveCyclePhase = ((t - 6.0) % 8.0 + 8.0) % 8.0 / 8.0;
      const shoreSurge = 0.5 + 0.5 * Math.sin(waveCyclePhase * Math.PI * 2);

      // -----------------------------------------------------------------------
      // 圖層 A: 天空色塊 (Layer: Sky Block Planes)
      // -----------------------------------------------------------------------
      const skyFill = getLayerFill(0.0, 0.35);
      if (skyFill > 0) {
        ctx.save();
        const wipeW = BASE_W * Math.min(1.0, skyFill * 1.25);
        ctx.beginPath();
        ctx.rect(0, 0, wipeW, HORIZON_Y);
        ctx.clip();
        ctx.globalAlpha = Math.min(1.0, skyFill * 1.3);

        for (let i = 0; i < SKY_BANDS.length; i++) {
          const b = SKY_BANDS[i];
          ctx.fillStyle = b.c;
          ctx.beginPath();
          const offset0 = Math.sin(i * 1.5) * 6;
          const offset1 = Math.cos(i * 1.8) * 6;
          ctx.moveTo(0, b.y0 + offset0);
          ctx.lineTo(BASE_W, b.y0 + offset1);
          ctx.lineTo(BASE_W, b.y1 + offset1 + 2);
          ctx.lineTo(0, b.y1 + offset0 + 2);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 B: 橙粉色雲彩塊面 (Layer: Cloud Blocks)
      // -----------------------------------------------------------------------
      const cloudFill = getLayerFill(0.10, 0.42);
      if (cloudFill > 0) {
        ctx.save();
        const wipeW = BASE_W * Math.min(1.0, cloudFill * 1.3);
        ctx.beginPath();
        ctx.rect(0, 0, wipeW, HORIZON_Y);
        ctx.clip();
        ctx.globalAlpha = Math.min(1.0, cloudFill * 1.25);

        for (const cb of CLOUD_BLOCKS) {
          ctx.fillStyle = cb.color;
          ctx.beginPath();
          ctx.moveTo(cb.poly[0][0], cb.poly[0][1]);
          for (let k = 1; k < cb.poly.length; k++) {
            ctx.lineTo(cb.poly[k][0], cb.poly[k][1]);
          }
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 230, 200, 0.28)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 C: 夕陽光暈與太陽本體 (Layer: Sunset Sun & Golden Aura)
      // -----------------------------------------------------------------------
      const sunFill = getLayerFill(0.18, 0.48);
      if (sunFill > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1.0, sunFill * 1.4);

        const auraLayers = [
          { r: 72, c: 'rgba(250, 140, 75, 0.45)', segs: 14 },
          { r: 52, c: 'rgba(254, 185, 80, 0.65)', segs: 16 },
          { r: 34, c: 'rgba(255, 222, 120, 0.90)', segs: 18 },
          { r: 22, c: '#fffbee', segs: 24 }
        ];

        for (const al of auraLayers) {
          ctx.fillStyle = al.c;
          ctx.beginPath();
          for (let s = 0; s < al.segs; s++) {
            const angle = (s / al.segs) * Math.PI * 2;
            const rad = al.r + (hashCoord(s, al.r) - 0.5) * 4;
            const x = sunCenterX + Math.cos(angle) * rad;
            const y = sunCenterY + Math.sin(angle) * rad;
            if (s === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 D: 遠山分層塊面 (Layer: Distant Mountains)
      // -----------------------------------------------------------------------
      const mountainFill = getLayerFill(0.25, 0.56);
      if (mountainFill > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1.0, mountainFill * 1.3);

        for (let mIdx = 0; mIdx < MOUNTAINS.length; mIdx++) {
          const m = MOUNTAINS[mIdx];
          ctx.fillStyle = m.color;
          ctx.beginPath();
          ctx.moveTo(m.pts[0][0], m.pts[0][1]);
          for (let k = 1; k < m.pts.length; k++) {
            ctx.lineTo(m.pts[k][0], m.pts[k][1]);
          }
          ctx.lineTo(m.pts[m.pts.length - 1][0], HORIZON_Y);
          ctx.lineTo(m.pts[0][0], HORIZON_Y);
          ctx.closePath();
          ctx.fill();

          if (m.facets) {
            ctx.fillStyle = m.shadeColor;
            for (const f of m.facets) {
              ctx.beginPath();
              ctx.moveTo(f[0][0], f[0][1]);
              for (let k = 1; k < f.length; k++) {
                ctx.lineTo(f[k][0], f[k][1]);
              }
              ctx.closePath();
              ctx.fill();
            }
          }
        }
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 E: 海洋本體色塊 (Layer: Sea Surface Planes)
      // -----------------------------------------------------------------------
      const seaFill = getLayerFill(0.38, 0.68);
      if (seaFill > 0) {
        ctx.save();
        const wipeW = BASE_W * Math.min(1.0, seaFill * 1.3);
        ctx.beginPath();
        ctx.rect(0, HORIZON_Y - 2, wipeW, BASE_H - HORIZON_Y + 4);
        ctx.clip();
        ctx.globalAlpha = Math.min(1.0, seaFill * 1.25);

        for (let i = 0; i < SEA_BANDS.length; i++) {
          const sb = SEA_BANDS[i];
          ctx.fillStyle = sb.c;
          ctx.beginPath();
          ctx.moveTo(0, sb.y0);
          ctx.lineTo(BASE_W, sb.y0 + (i === 0 ? 0 : Math.sin(i) * 4));
          ctx.lineTo(BASE_W, sb.y1 + Math.cos(i) * 4);
          ctx.lineTo(0, sb.y1);
          ctx.closePath();
          ctx.fill();
        }

        // 翡翠綠透光水帶
        ctx.fillStyle = 'rgba(68, 178, 172, 0.38)';
        ctx.fillRect(0, 475, BASE_W, 12);
        ctx.fillStyle = 'rgba(85, 205, 195, 0.42)';
        ctx.fillRect(0, 520, BASE_W, 16);

        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 F: 海面上的垂直長條夕陽反光 (Layer: Vertical Elongated Reflection)
      // -----------------------------------------------------------------------
      const reflectFill = getLayerFill(0.42, 0.72);
      if (reflectFill > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1.0, reflectFill * 1.2);

        const refRows = 38;
        const refStartY = HORIZON_Y + 1;
        const refEndY = 635;

        for (let r = 0; r < refRows; r++) {
          const ry = refStartY + (r / refRows) * (refEndY - refStartY);
          const vFrac = r / refRows;
          const baseWidth = 24 + vFrac * 95;
          const shimmer = (t >= 4.0) ? Math.sin(t * 3.6 + r * 0.45) * (4 + vFrac * 8) : 0;
          const pulse = (t >= 4.0) ? 0.8 + 0.2 * Math.sin(t * 4.8 + r * 0.7) : 1.0;
          const rx = sunCenterX - (baseWidth / 2) + shimmer;

          ctx.fillStyle = (vFrac < 0.35)
            ? 'rgba(255, 250, 220, ' + (0.95 * pulse) + ')'
            : (vFrac < 0.7)
              ? 'rgba(254, 218, 110, ' + (0.88 * pulse) + ')'
              : 'rgba(250, 160, 75, ' + (0.75 * pulse) + ')';

          const strokeH = 3.2 + vFrac * 2.8;
          ctx.fillRect(rx, ry, baseWidth, strokeH);

          if (vFrac < 0.75) {
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.9 * pulse) + ')';
            ctx.fillRect(sunCenterX - (baseWidth * 0.28) + shimmer * 0.5, ry + 0.6, baseWidth * 0.56, strokeH * 0.6);
          }
        }
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 G: 沙灘弧線與潮間帶 (Layer: Curved Sandy Shore & Wet Sand)
      // -----------------------------------------------------------------------
      const beachFill = getLayerFill(0.55, 0.82);
      if (beachFill > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1.0, beachFill * 1.3);

        // 1. 暖黃乾燥沙灘基底 (從海岸線延伸至右下角)
        ctx.fillStyle = '#dcad70';
        ctx.beginPath();
        ctx.moveTo(BEACH_SHORELINE[0][0], BEACH_SHORELINE[0][1]);
        for (let i = 1; i < BEACH_SHORELINE.length; i++) {
          ctx.lineTo(BEACH_SHORELINE[i][0], BEACH_SHORELINE[i][1]);
        }
        ctx.lineTo(BASE_W, BASE_H);
        ctx.lineTo(0, BASE_H);
        ctx.closePath();
        ctx.fill();

        // 2. 金赭色沙質紋理塊面
        ctx.fillStyle = '#cf9d5d';
        ctx.beginPath();
        ctx.moveTo(120, 610);
        ctx.lineTo(580, 640);
        ctx.lineTo(920, 700);
        ctx.lineTo(1100, 720);
        ctx.lineTo(120, 720);
        ctx.closePath();
        ctx.fill();

        // 3. 潮間帶深色濕沙面 (Wet sand zone)
        ctx.fillStyle = '#9b6c55';
        ctx.beginPath();
        ctx.moveTo(BEACH_SHORELINE[0][0], BEACH_SHORELINE[0][1]);
        for (let i = 1; i < BEACH_SHORELINE.length; i++) {
          ctx.lineTo(BEACH_SHORELINE[i][0], BEACH_SHORELINE[i][1]);
        }
        ctx.lineTo(BEACH_SHORELINE[BEACH_SHORELINE.length - 1][0], BEACH_SHORELINE[BEACH_SHORELINE.length - 1][1] + 45);
        for (let i = BEACH_SHORELINE.length - 2; i >= 0; i--) {
          ctx.lineTo(BEACH_SHORELINE[i][0], BEACH_SHORELINE[i][1] + 45);
        }
        ctx.closePath();
        ctx.fill();

        // 4. 濕潤沙面反光水膜 (Reflecting sunset sky)
        ctx.fillStyle = 'rgba(240, 160, 130, 0.38)';
        ctx.beginPath();
        ctx.moveTo(BEACH_SHORELINE[0][0], BEACH_SHORELINE[0][1] + 5);
        for (let i = 1; i < BEACH_SHORELINE.length; i++) {
          ctx.lineTo(BEACH_SHORELINE[i][0], BEACH_SHORELINE[i][1] + 5);
        }
        ctx.lineTo(BEACH_SHORELINE[BEACH_SHORELINE.length - 1][0], BEACH_SHORELINE[BEACH_SHORELINE.length - 1][1] + 30);
        for (let i = BEACH_SHORELINE.length - 2; i >= 0; i--) {
          ctx.lineTo(BEACH_SHORELINE[i][0], BEACH_SHORELINE[i][1] + 30);
        }
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 H: 層疊碎浪與浪花白沫 (Layer: Cascading Waves & Shore Surge)
      // 關鍵要求：在 t=8.0 秒與 t=12.0 秒時，浪的位置必須明顯不同！
      // -----------------------------------------------------------------------
      const waveFill = getLayerFill(0.65, 0.92);
      if (waveFill > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1.0, waveFill * 1.3);

        // 遠處碎浪條 1 (Distant crest)
        ctx.fillStyle = 'rgba(245, 252, 255, 0.85)';
        ctx.beginPath();
        const distWaveY = 448 + Math.sin(t * 1.2) * 2;
        ctx.rect(0, distWaveY, 780, 4.5);
        ctx.fill();

        // 中景翻捲碎浪 2 (Mid-surf breaking curl)
        const midWavePhase = ((t * 0.32) % 1.0);
        const midWaveY = 490 + midWavePhase * 32;
        ctx.fillStyle = '#177484';
        ctx.beginPath();
        ctx.moveTo(0, midWaveY + 10);
        for (let x = 0; x <= 950; x += 60) {
          const wy = midWaveY + 10 + Math.sin(x * 0.02 + t * 2.5) * 4;
          ctx.lineTo(x, wy);
        }
        ctx.lineTo(950, midWaveY + 20);
        ctx.lineTo(0, midWaveY + 20);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, midWaveY);
        for (let x = 0; x <= 920; x += 35) {
          const cy = midWaveY + Math.sin(x * 0.035 + t * 3.2) * 5;
          ctx.lineTo(x, cy);
        }
        ctx.lineTo(920, midWaveY + 8);
        ctx.lineTo(0, midWaveY + 8);
        ctx.closePath();
        ctx.fill();

        // ---------------------------------------------------------------------
        // 灘頭衝擊主浪 (Shoreline Surge Wave)
        // shoreSurge = 1.0 (t=8.0s: 浪推上灘頭最頂端，白沫大量散開)
        // shoreSurge = 0.0 (t=12.0s: 浪完全退到底，沙灘退潮露出濕沙)
        // ---------------------------------------------------------------------
        // 衝程 115 像素
        const surgeDistance = shoreSurge * 115;

        // 只有當湧浪推進沙灘時，才繪製覆蓋在沙灘上的半透明海水舌
        if (shoreSurge > 0.05) {
          ctx.fillStyle = 'rgba(42, 148, 160, ' + (0.55 + shoreSurge * 0.25) + ')';
          ctx.beginPath();
          // 海浪後緣 (海側)
          ctx.moveTo(0, 520);
          for (let i = 0; i < BEACH_SHORELINE.length; i++) {
            ctx.lineTo(BEACH_SHORELINE[i][0], BEACH_SHORELINE[i][1] - 15);
          }
          // 海浪前緣 (衝上海灘的弧線水舌)
          for (let i = BEACH_SHORELINE.length - 1; i >= 0; i--) {
            const pt = BEACH_SHORELINE[i];
            const u = i / (BEACH_SHORELINE.length - 1);
            const surgeY = pt[1] + surgeDistance * (1.0 - u * 0.3);
            ctx.lineTo(pt[0], surgeY);
          }
          ctx.closePath();
          ctx.fill();

          // 浪頭前緣翻白浪線與齒狀泡沫 (Scalloped White Foam Collar)
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          const foamPts = [];
          for (let x = 0; x <= 1080; x += 20) {
            const u = x / 1080;
            const baseY = 530 + u * 190;
            const scallop = Math.sin(x * 0.08 + t * 4) * 6 + Math.cos(x * 0.03) * 4;
            const fy = baseY + surgeDistance * (1.0 - u * 0.28) + scallop;
            foamPts.push([x, fy]);
          }

          ctx.moveTo(foamPts[0][0], foamPts[0][1]);
          for (let k = 1; k < foamPts.length; k++) {
            ctx.lineTo(foamPts[k][0], foamPts[k][1]);
          }
          const foamThickness = 12 + shoreSurge * 26;
          for (let k = foamPts.length - 1; k >= 0; k--) {
            ctx.lineTo(foamPts[k][0], foamPts[k][1] - foamThickness);
          }
          ctx.closePath();
          ctx.fill();

          // 灘頭消退細碎泡沫 (Foam lace & bubbles)
          if (shoreSurge > 0.2) {
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.88 * shoreSurge) + ')';
            for (let b = 0; b < 55; b++) {
              const bx = hashCoord(b, 31) * 980;
              const byBase = 530 + (bx / 1080) * 190 + surgeDistance * 0.88;
              const by = byBase - hashCoord(b, 47) * (foamThickness + 20);
              const br = 2.5 + hashCoord(b, 59) * 4.8;
              ctx.beginPath();
              ctx.arc(bx, by, br, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        } else {
          // 當浪退回海中最低點 (如 t=12.0s)：沙灘邊緣只留下一道極細淺淡的退潮殘沫線
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(BEACH_SHORELINE[0][0], BEACH_SHORELINE[0][1] - 8);
          for (let i = 1; i < BEACH_SHORELINE.length; i++) {
            ctx.lineTo(BEACH_SHORELINE[i][0], BEACH_SHORELINE[i][1] - 8);
          }
          ctx.stroke();
        }

        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 I: 前景草坡塊面 (Layer: Grassy Hill Slope)
      // -----------------------------------------------------------------------
      const hillFill = getLayerFill(0.68, 0.90);
      if (hillFill > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1.0, hillFill * 1.3);

        // 1. 土石深褐塊面
        ctx.fillStyle = '#4a3625';
        ctx.beginPath();
        ctx.moveTo(GRASS_HILL_PATH[0][0], GRASS_HILL_PATH[0][1]);
        for (let k = 1; k < GRASS_HILL_PATH.length; k++) {
          ctx.lineTo(GRASS_HILL_PATH[k][0], GRASS_HILL_PATH[k][1]);
        }
        ctx.closePath();
        ctx.fill();

        // 2. 墨綠與橄欖草皮層
        ctx.fillStyle = '#395320';
        ctx.beginPath();
        ctx.moveTo(850, 720);
        ctx.lineTo(890, 665);
        ctx.lineTo(960, 610);
        ctx.lineTo(1050, 565);
        ctx.lineTo(1160, 535);
        ctx.lineTo(1280, 520);
        ctx.lineTo(1280, 720);
        ctx.closePath();
        ctx.fill();

        // 3. 翠綠色向陽草坡塊面
        ctx.fillStyle = '#5c852e';
        ctx.beginPath();
        ctx.moveTo(900, 720);
        ctx.lineTo(930, 675);
        ctx.lineTo(1010, 615);
        ctx.lineTo(1120, 560);
        ctx.lineTo(1240, 535);
        ctx.lineTo(1280, 530);
        ctx.lineTo(1280, 720);
        ctx.closePath();
        ctx.fill();

        // 4. 坡頂金綠色受光塊
        ctx.fillStyle = '#88b53d';
        ctx.beginPath();
        ctx.moveTo(980, 720);
        ctx.lineTo(1050, 645);
        ctx.lineTo(1170, 580);
        ctx.lineTo(1280, 555);
        ctx.lineTo(1280, 720);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 J: 迎風斜松樹幹與松針團塊上色 (Layer: Leaning Pine Tree)
      // -----------------------------------------------------------------------
      const pineFill = getLayerFill(0.74, 0.98);
      if (pineFill > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1.0, pineFill * 1.3);

        const pineWindSway = (t >= 4.0) ? Math.sin(t * 1.6) * 2.2 : 0;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 樹幹深色輪廓
        ctx.strokeStyle = '#221610';
        ctx.lineWidth = 26;
        ctx.beginPath();
        ctx.moveTo(PINE_TRUNK_PATH[0][0], PINE_TRUNK_PATH[0][1]);
        for (let k = 1; k < PINE_TRUNK_PATH.length; k++) {
          ctx.lineTo(PINE_TRUNK_PATH[k][0] + pineWindSway * (k / PINE_TRUNK_PATH.length), PINE_TRUNK_PATH[k][1]);
        }
        ctx.stroke();

        // 樹幹受光赭紅塊面
        ctx.strokeStyle = '#4e2d1d';
        ctx.lineWidth = 18;
        ctx.beginPath();
        ctx.moveTo(PINE_TRUNK_PATH[0][0] - 2, PINE_TRUNK_PATH[0][1]);
        for (let k = 1; k < PINE_TRUNK_PATH.length; k++) {
          ctx.lineTo(PINE_TRUNK_PATH[k][0] - 2 + pineWindSway * (k / PINE_TRUNK_PATH.length), PINE_TRUNK_PATH[k][1]);
        }
        ctx.stroke();

        // 樹幹金色夕陽高光反光
        ctx.strokeStyle = '#855132';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(PINE_TRUNK_PATH[0][0] - 4, PINE_TRUNK_PATH[0][1]);
        for (let k = 1; k < PINE_TRUNK_PATH.length; k++) {
          ctx.lineTo(PINE_TRUNK_PATH[k][0] - 4 + pineWindSway * (k / PINE_TRUNK_PATH.length), PINE_TRUNK_PATH[k][1]);
        }
        ctx.stroke();

        // 各分枝
        for (let bIdx = 0; bIdx < PINE_BRANCHES.length; bIdx++) {
          const br = PINE_BRANCHES[bIdx];
          ctx.strokeStyle = '#281a13';
          ctx.lineWidth = 11 - bIdx * 1.5;
          ctx.beginPath();
          ctx.moveTo(br[0][0] + pineWindSway * 0.5, br[0][1]);
          for (let k = 1; k < br.length; k++) {
            ctx.lineTo(br[k][0] + pineWindSway, br[k][1]);
          }
          ctx.stroke();
        }

        // 2. 松針雲塊 (Tiered Matsu Cloud Clusters)
        for (let cIdx = 0; cIdx < PINE_PADS.length; cIdx++) {
          const pad = PINE_PADS[cIdx];
          const cx = pad.x + pineWindSway * 1.2;
          const cy = pad.y;

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(pad.rot);

          // 第一層：松針暗色基底 (Dark base)
          ctx.fillStyle = '#0f2418';
          ctx.beginPath();
          ctx.ellipse(0, 0, pad.rx, pad.ry, 0, 0, Math.PI * 2);
          ctx.fill();

          // 第二層：松針濃綠塊面 (Rich evergreen body)
          ctx.fillStyle = '#1c422c';
          ctx.beginPath();
          ctx.ellipse(-3, -2, pad.rx * 0.82, pad.ry * 0.82, 0, 0, Math.PI * 2);
          ctx.fill();

          // 第三層：夕陽透光翠綠 (Viridian highlight)
          ctx.fillStyle = '#2d6842';
          ctx.beginPath();
          ctx.ellipse(-6, -4, pad.rx * 0.58, pad.ry * 0.60, 0, 0, Math.PI * 2);
          ctx.fill();

          // 第四層：松針邊緣短針葉筆觸
          ctx.strokeStyle = '#4e8a5b';
          ctx.lineWidth = 1.4;
          const needles = 20;
          for (let n = 0; n < needles; n++) {
            const ang = (n / needles) * Math.PI * 2;
            const r0 = pad.rx * 0.75;
            const r1 = pad.rx * 1.08;
            ctx.beginPath();
            ctx.moveTo(Math.cos(ang) * r0, Math.sin(ang) * (r0 * (pad.ry / pad.rx)));
            ctx.lineTo(Math.cos(ang) * r1, Math.sin(ang) * (r1 * (pad.ry / pad.rx)));
            ctx.stroke();
          }

          ctx.restore();
        }

        ctx.restore();
      } else {
        // 若松樹尚未上色 (例如 t=3.0s)，在彩色天空/山海上方重新勾勒出松樹鉛筆素描！
        // 確保呈現顯著的「部分上色 + 部分素描線條並存」！
        ctx.save();
        drawPineSketch(ctx, 1.0);
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 圖層 K: 前景搖曳草葉細節 (Layer: Swaying Grass Blade Details)
      // -----------------------------------------------------------------------
      const grassBladeFill = getLayerFill(0.78, 1.0);
      if (grassBladeFill > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1.0, grassBladeFill * 1.3);

        for (let i = 0; i < GRASS_BLADES.length; i++) {
          const gb = GRASS_BLADES[i];
          const windSway = (t >= 4.0)
            ? Math.sin(t * gb.swayFreq + gb.swayPhase) * 0.22 + Math.cos(t * 1.4) * 0.08
            : 0;

          const angle = gb.baseAngle + windSway;
          const tipX = gb.x + Math.cos(angle) * gb.length;
          const tipY = gb.y + Math.sin(angle) * gb.length;
          const cpX = gb.x + Math.cos(angle + 0.2) * (gb.length * 0.55);
          const cpY = gb.y + Math.sin(angle + 0.2) * (gb.length * 0.55);

          ctx.strokeStyle = (i % 3 === 0) ? '#a2cd48' : (i % 2 === 0) ? '#689e32' : '#3d611f';
          ctx.lineWidth = gb.width;
          ctx.beginPath();
          ctx.moveTo(gb.x, gb.y);
          ctx.quadraticCurveTo(cpX, cpY, tipX, tipY);
          ctx.stroke();

          if (i % 4 === 0) {
            ctx.fillStyle = '#fedd82';
            ctx.beginPath();
            ctx.arc(tipX, tipY, 2.0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // 木版畫精緻鍵線 (Delicate Woodblock Keylines Overlay)
      // -----------------------------------------------------------------------
      if (colorP > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(30, 26, 24, ' + (0.35 * colorP) + ')';
        ctx.lineWidth = 1.2;

        // 遠山脊線
        for (const m of MOUNTAINS) {
          ctx.beginPath();
          ctx.moveTo(m.pts[0][0], m.pts[0][1]);
          for (let k = 1; k < m.pts.length; k++) {
            ctx.lineTo(m.pts[k][0], m.pts[k][1]);
          }
          ctx.stroke();
        }

        // 沙岸弧線
        ctx.beginPath();
        ctx.moveTo(BEACH_SHORELINE[0][0], BEACH_SHORELINE[0][1]);
        for (let k = 1; k < BEACH_SHORELINE.length; k++) {
          ctx.lineTo(BEACH_SHORELINE[k][0], BEACH_SHORELINE[k][1]);
        }
        ctx.stroke();

        ctx.restore();
      }

      ctx.restore();
    }

    // =========================================================================
    // 模組匯出與 window.renderAt 支援 (嚴格符合規範)
    // =========================================================================
    if (typeof window !== 'undefined') {
      window.renderAt = function(t, customCtx, customWidth, customHeight) {
        const canvasEl = document.getElementById('sunsetCanvas');
        const c = customCtx || (canvasEl ? canvasEl.getContext('2d') : null);
        const w = customWidth || (canvasEl ? canvasEl.width : BASE_W);
        const h = customHeight || (canvasEl ? canvasEl.height : BASE_H);
        if (c) renderScene(c, w, h, t);
      };
    }
    if (typeof module !== 'undefined' && module.exports) {
      module.exports = { renderScene };
    }

    // =========================================================================
    // 瀏覽器自動播放邏輯 (requestAnimationFrame 循環與 HUD 更新)
    // =========================================================================
    if (typeof window !== 'undefined' && document.getElementById('sunsetCanvas')) {
      const canvas = document.getElementById('sunsetCanvas');
      const ctx = canvas.getContext('2d');
      const timeDisplay = document.getElementById('timeDisplay');
      const phaseDisplay = document.getElementById('phaseDisplay');
      const replayBtn = document.getElementById('replayBtn');

      let startTime = null;
      let isPlaying = true;
      let currentT = 0;

      function updateHUD(t) {
        if (!timeDisplay || !phaseDisplay) return;
        timeDisplay.textContent = 't: ' + t.toFixed(2) + 's';
        if (t < 1.5) {
          phaseDisplay.textContent = '鉛筆素描線稿勾勒';
          phaseDisplay.style.color = '#c9c5ba';
        } else if (t < 4.0) {
          phaseDisplay.textContent = '塊面筆觸分層上色中';
          phaseDisplay.style.color = '#f7a865';
        } else {
          phaseDisplay.textContent = '上色完成 / 潮浪草木持續動態';
          phaseDisplay.style.color = '#79d2a6';
        }
      }

      function loop(timestamp) {
        if (!startTime) startTime = timestamp;
        if (isPlaying) {
          const elapsed = (timestamp - startTime) / 1000;
          currentT = elapsed % 13.0;
          renderScene(ctx, canvas.width, canvas.height, currentT);
          updateHUD(currentT);
        }
        requestAnimationFrame(loop);
      }

      if (replayBtn) {
        replayBtn.addEventListener('click', () => {
          startTime = performance.now();
          currentT = 0;
          isPlaying = true;
        });
      }

      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
