<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宅邸物語・互動故事聊天</title>
<style>
:root{
  --bg:#0b1020;
  --bg2:#101731;
  --panel:#141c38;
  --panel2:#1a2447;
  --gold:#d8b36a;
  --gold2:#f0d9a8;
  --text:#e8e6df;
  --muted:#9aa3bd;
  --bubble:#1c2a52;
  --line:#2a3560;
  --danger:#e07070;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;overflow-x:hidden;}
body{padding:0 16px calc(16px + env(safe-area-inset-bottom));}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;}
textarea{resize:vertical;min-height:120px;line-height:1.6;}
h2{font-size:18px;color:var(--gold);margin:0 0 10px;}
h3{font-size:16px;margin:16px 0 8px;color:var(--gold2);}
.hidden{display:none !important;}

/* 頂部列 */
#topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px;
  background:linear-gradient(180deg,#0b1020 70%,rgba(11,16,32,0));
  display:flex;align-items:center;gap:8px;}
#chapterName{font-size:15px;font-weight:700;color:var(--gold);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#statusLine{font-size:11px;color:var(--muted);flex:2;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
#menuBtn{background:var(--panel2);border:1px solid var(--line);color:var(--gold);
  border-radius:10px;width:38px;height:38px;font-size:18px;flex:none;}

/* 聊天區 */
#chatWrap{position:relative;border-radius:16px;overflow:hidden;min-height:60vh;
  background-size:cover;background-position:center;}
#chatWrap::before{content:"";position:absolute;inset:0;background:rgba(8,12,26,.78);
  transition:background .6s ease;}
#chat{position:relative;z-index:1;padding:14px 10px;display:flex;flex-direction:column;gap:12px;}
.msg-narr{font-size:15px;line-height:1.9;color:var(--text);
  background:rgba(20,28,56,.72);border-left:3px solid var(--gold);
  border-radius:8px;padding:10px 12px;}
.msg-narr em{color:var(--gold2);font-style:italic;}
.msg-line{display:flex;gap:10px;align-items:flex-start;}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;
  border:2px solid var(--gold);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;}
.bubble-wrap{min-width:0;}
.speaker-name{font-size:12px;color:var(--gold);margin-bottom:4px;}
.bubble{background:var(--bubble);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
  padding:10px 12px;font-size:15px;line-height:1.8;}
.msg-msg{align-self:flex-end;width:82%;max-width:340px;}
.phone-card{background:#0e1631;border:1px solid var(--line);border-radius:16px;
  padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.4);}
.phone-head{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);
  padding-bottom:6px;margin-bottom:8px;display:flex;gap:6px;align-items:center;}
.phone-text{font-size:14px;line-height:1.7;background:#1c2a52;border-radius:12px 12px 12px 4px;
  padding:8px 10px;display:inline-block;}
.msg-user{align-self:flex-end;max-width:85%;background:linear-gradient(135deg,#2a3a6e,#22305c);
  border:1px solid var(--gold);border-radius:14px 4px 14px 14px;padding:10px 12px;font-size:15px;line-height:1.7;}
.msg-sys{align-self:center;font-size:12px;color:var(--muted);text-align:center;}
.msg-raw{white-space:pre-wrap;font-size:14px;color:#f3c9c9;background:rgba(70,30,30,.4);
  border:1px solid var(--danger);border-radius:8px;padding:10px;}
.chat-mode-plain .msg-narr,.chat-mode-plain .bubble,.chat-mode-plain .phone-card{background:transparent;border-color:transparent;}
#typing{align-self:flex-start;color:var(--muted);font-size:20px;letter-spacing:3px;padding:4px 10px;}
#reRoll{align-self:center;background:transparent;border:1px dashed var(--gold);color:var(--gold);
  border-radius:20px;padding:6px 16px;font-size:13px;}

/* 建議與輸入 */
#suggestRow{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;-webkit-overflow-scrolling:touch;}
.sug-btn{flex:none;max-width:78%;background:var(--panel2);border:1px solid var(--gold);
  color:var(--gold2);border-radius:18px;padding:8px 14px;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#inputRow{display:flex;gap:8px;align-items:flex-end;}
#userInput{flex:1;}
#sendBtn{background:var(--gold);color:#1a1408;border:none;border-radius:12px;
  padding:11px 18px;font-weight:700;font-size:15px;flex:none;}

/* Modal */
.modal-mask{position:fixed;inset:0;z-index:60;background:rgba(4,6,14,.8);
  display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-card{background:var(--panel);border:1px solid var(--gold);border-radius:16px;
  padding:20px;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;}
.modal-card p{font-size:14px;line-height:1.8;color:var(--text);margin:8px 0;}
.hint{color:var(--muted);font-size:13px !important;}
.btn{background:var(--gold);color:#1a1408;border:none;border-radius:12px;
  padding:11px 16px;font-weight:700;font-size:15px;width:100%;margin-top:10px;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
.err-text{color:var(--danger);font-size:13px !important;}

/* 選單 */
#drawerMask{position:fixed;inset:0;z-index:50;background:rgba(4,6,14,.6);}
#drawer{position:fixed;top:0;right:0;bottom:0;z-index:55;width:min(88vw,400px);
  background:var(--panel);border-left:1px solid var(--line);
  padding:16px;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
.drawer-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.drawer-top h2{flex:1;}
#drawerClose{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;width:34px;height:34px;font-size:16px;}
.menu-list{display:flex;flex-direction:column;gap:8px;}
.menu-item{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:13px 14px;font-size:15px;text-align:left;
  display:flex;justify-content:space-between;align-items:center;}
.menu-item span{color:var(--gold);font-size:12px;}
.panel-back{background:none;border:none;color:var(--muted);font-size:14px;padding:0 0 10px;}
.panel label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;}
.panel .small-btn{background:var(--panel2);border:1px solid var(--line);color:var(--gold2);
  border-radius:10px;padding:8px 12px;font-size:13px;width:auto;margin-top:6px;}
.char-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:12px;margin-bottom:12px;}
.char-card .char-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.char-card img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);}
.char-card .char-name{font-weight:700;color:var(--gold2);}
.char-card .char-meta{font-size:12px;color:var(--muted);}
.char-card p{font-size:13px;line-height:1.7;color:var(--text);margin:6px 0;}
.char-card .row{display:flex;gap:8px;flex-wrap:wrap;}
.chat-item{display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:8px;font-size:14px;}
.chat-item.active{border-color:var(--gold);}
.radio-row{display:flex;gap:14px;align-items:center;margin:6px 0;}
.radio-row label{display:flex;gap:6px;align-items:center;margin:0;font-size:14px;color:var(--text);}
.radio-row input{width:auto;}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px;}

/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
  background:#20294d;border:1px solid var(--gold);color:var(--gold2);
  border-radius:24px;padding:10px 20px;font-size:14px;z-index:99;
  opacity:0;transition:opacity .3s;pointer-events:none;max-width:86vw;text-align:center;}
#quotePop{position:fixed;z-index:70;left:50%;bottom:120px;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--gold);border-radius:12px;
  padding:10px 14px;font-size:14px;color:var(--gold2);}

/* 訊息卡片 */
#cardPop{position:fixed;z-index:72;background:var(--panel2);border:1px solid var(--gold);
  border-radius:12px;padding:10px 14px;font-size:14px;color:var(--gold2);white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.5);}
#cardSelBar{position:fixed;top:0;left:0;right:0;z-index:65;
  background:var(--panel);border-bottom:1px solid var(--gold);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top));}
#cardSelBar .sel-count{flex:1;font-size:14px;color:var(--gold2);}
#cardSelBar button{background:var(--gold);color:#1a1408;border:none;border-radius:10px;
  padding:8px 16px;font-weight:700;font-size:14px;flex:none;}
#cardSelBar button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);}
.card-sel{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px;}
</style>
</head>
<body>

<div id="topbar">
  <div id="chapterName">宅邸物語</div>
  <div id="statusLine"></div>
  <button id="menuBtn" aria-label="選單">☰</button>
</div>

<div id="chatWrap">
  <div id="chat" class="chat-mode-bubble"></div>
</div>

<div id="suggestRow"></div>

<div id="inputRow">
  <textarea id="userInput" rows="1" placeholder="輸入許知夏的話或動作…"></textarea>
  <button id="sendBtn">送出</button>
</div>

<!-- 金鑰設定卡 -->
<div id="keyModal" class="modal-mask hidden">
  <div class="modal-card">
    <h2>設定 API 金鑰</h2>
    <p>本頁直接由瀏覽器呼叫 Google 生成式 API，不需中介伺服器。</p>
    <p class="hint">到 aistudio.google.com 按 Get API key，複製貼上。</p>
    <label style="font-size:13px;color:var(--muted);display:block;margin:10px 0 5px;">API 金鑰</label>
    <input id="keyInput" type="password" placeholder="貼上金鑰" autocomplete="off">
    <p id="keyErr" class="err-text hidden"></p>
    <button class="btn" id="keySaveBtn">儲存並連線</button>
  </div>
</div>

<!-- 選單 -->
<div id="drawerMask" class="hidden"></div>
<aside id="drawer" class="hidden">
  <div class="drawer-top">
    <h2 id="drawerTitle">選單</h2>
    <button id="drawerClose">✕</button>
  </div>
  <div class="menu-list" id="menuList">
    <button class="menu-item" data-panel="memory">長期記憶本<span>整理故事進度</span></button>
    <button class="menu-item" data-panel="profile">我的人設<span>名字・介紹・頭像</span></button>
    <button class="menu-item" data-panel="chars">角色<span>四位登場人物</span></button>
    <button class="menu-item" data-panel="settings">設定<span>顯示・模型・背景</span></button>
    <button class="menu-item" data-panel="chats">聊天管理<span>多段聊天・分支</span></button>
    <button class="menu-item" data-panel="quote">名言卡<span>把台詞做成圖卡</span></button>
    <button class="menu-item" id="cardMsgMenuBtn">訊息卡片<span>選訊息做圖卡分享</span></button>
  </div>

  <div class="panel hidden" id="panel-memory">
    <button class="panel-back" data-back>← 回選單</button>
    <h2>長期記憶本</h2>
    <p class="hint">模型每次回覆都會讀取這份記憶；修改後要按「儲存」才會生效。</p>
    <textarea id="memoryText" placeholder="（空白）記下重要的事件、好感變化、伏筆…"></textarea>
    <div class="count" id="memoryCount">0 字</div>
    <button class="btn" id="memorySaveBtn">儲存</button>
    <button class="btn btn-ghost" id="memoryDraftBtn">幫我整理（呼叫模型產生草稿）</button>
  </div>

  <div class="panel hidden" id="panel-profile">
    <button class="panel-back" data-back>← 回選單</button>
    <h2>我的人設</h2>
    <label>名字</label>
    <input id="profileName">
    <label>介紹</label>
    <textarea id="profileIntro" style="min-height:160px"></textarea>
    <label>頭像</label>
    <div style="display:flex;gap:10px;align-items:center;">
      <img id="profileAvatarImg" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);display:none;">
      <button class="small-btn" id="profileAvatarBtn">上傳頭像</button>
    </div>
    <button class="btn" id="profileSaveBtn">儲存</button>
  </div>

  <div class="panel hidden" id="panel-chars">
    <button class="panel-back" data-back>← 回選單</button>
    <h2>角色</h2>
    <div id="charCards"></div>
  </div>

  <div class="panel hidden" id="panel-settings">
    <button class="panel-back" data-back>← 回選單</button>
    <h2>設定</h2>
    <label>回覆長度</label>
    <div class="radio-row">
      <label><input type="radio" name="replyLen" value="short"> 短</label>
      <label><input type="radio" name="replyLen" value="long"> 長</label>
    </div>
    <label>章節模式</label>
    <div class="radio-row">
      <label><input type="checkbox" id="chapterMode"> 依章節推進（每換章先標章名）</label>
    </div>
    <label>聊天背景</label>
    <div class="radio-row">
      <label><input type="checkbox" id="chatBgOn"> 啟用自訂聊天背景</label>
    </div>
    <button class="small-btn" id="chatBgBtn">上傳聊天背景圖</button>
    <label>說話者背景</label>
    <div class="radio-row">
      <label><input type="checkbox" id="speakerBgOn"> 跟著說話的角色換背景照（淡入淡出）</label>
    </div>
    <label>顯示方式</label>
    <div class="radio-row">
      <label><input type="radio" name="dispMode" value="bubble"> 對話泡泡</label>
      <label><input type="radio" name="dispMode" value="plain"> 純文字</label>
    </div>
    <label>模型</label>
    <select id="modelSelect"></select>
    <button class="btn btn-ghost" id="changeKeyBtn">更換金鑰</button>
  </div>

  <div class="panel hidden" id="panel-chats">
    <button class="panel-back" data-back>← 回選單</button>
    <h2>聊天管理</h2>
    <button class="btn" id="newChatBtn">開始新聊天（第一章第一晚開場）</button>
    <button class="btn btn-ghost" id="branchBtn">開始分支（複製目前聊天）</button>
    <button class="btn btn-danger" id="deleteChatBtn">刪除這段聊天</button>
    <h3>聊天列表</h3>
    <div id="chatList"></div>
  </div>

  <div class="panel hidden" id="panel-quote">
    <button class="panel-back" data-back>← 回選單</button>
    <h2>名言卡</h2>
    <p class="hint">在聊天中「長按或點選」任何一句角色台詞，即可把它做成直式名言卡，可分享或下載 PNG。</p>
    <button class="btn btn-ghost" id="quoteTryBtn">檢視目前可選台詞</button>
  </div>
</aside>

<input type="file" id="filePicker" accept="image/*" class="hidden">
<div id="toast"></div>
<div id="quotePop" class="hidden">做成名言卡</div>
<canvas id="quoteCanvas" class="hidden"></canvas>
<div id="cardPop" class="hidden">做成訊息卡片</div>
<div id="cardSelBar" class="hidden">
  <div class="sel-count">已選 <b id="cardSelCount">0</b> 則</div>
  <button id="cardDoneBtn">完成</button>
  <button id="cardCancelBtn" class="ghost">取消</button>
</div>

<!-- 訊息卡片預覽 -->
<div id="cardPreviewModal" class="modal-mask hidden">
  <div class="modal-card">
    <h2>訊息卡片</h2>
    <img id="cardPreviewImg" alt="訊息卡片預覽" style="width:100%;border-radius:12px;border:1px solid var(--gold);display:block;">
    <button class="btn" id="cardShareBtn">分享</button>
    <button class="btn btn-ghost" id="cardSaveBtn">存圖</button>
    <button class="btn btn-ghost" id="cardCloseBtn">關閉</button>
  </div>
</div>

<script>
"use strict";
/* ===================== 常數與預設資料 ===================== */
var API_BASE = "https://generativelanguage.googleapis.com";
var LS = {
  key: "fs_key", settings: "fs_settings", profile: "fs_profile",
  memory: "fs_memory", chats: "fs_chats", order: "fs_order",
  active: "fs_active", models: "fs_models"
};
var MOCK = /[?&]mock=1/.test(location.search);

var HEROINE_DEFAULT = "許知夏，24歲，文學院畢業，會英法西三語，在藝術學院唸研究所。五官柔和精緻、眼神清澈、皮膚白；有時專注清冷，有時像隻靈動的小狐狸。";

var CHARACTERS = [
  { id:"han", name:"韓曜辰", age:29, height:"188cm",
    intro:"韓家現任掌權人、宅邸真正主人。金灰色頭髮、淡金偏銅色眼睛，高級訂製西裝、深色襯衫、大衣，低調奢華。冷靜、理性、寡言、極度自律，對外人距離感明顯；厭煩帶目的接近他的人。第一次回家就被女主角毫不留情趕出門（她不認得他）。起初覺得被侵犯領地，後來漸漸習慣她在，甚至依賴那份安心感。" },
  { id:"gu", name:"顧承硯", age:32, height:"187cm",
    intro:"韓曜辰最信任的心腹，處理家族、公司與私人事務。藍灰色頭髮、藍色眼睛，穿著講究、舉止從容，看起來極度嚴謹。實際上非常愛看戲、愛八卦。找女主角入住是他的主意，故意不說韓曜辰的身分；早就知道會出亂子，卻樂於看韓曜辰一次次被趕出自己的房子。笑點低。" },
  { id:"jl", name:"姜凜", age:27, height:"190cm",
    intro:"韓家頂級私人保鑣，姜朔的雙胞胎哥哥。黑色短髮、深灰色眼睛、黑色戰術服。寡言、冷靜、自律、效率極高，只認命令；戒心強，對認定的人極忠誠也護短。起初只把她當工作對象，後來發現她連真正的韓曜辰都敢趕，開始覺得驚訝又好笑，不知不覺把保護她當成責任。別人稱讚他帥他無感，但她誇他時會在意。" },
  { id:"js", name:"姜朔", age:27, height:"190cm",
    intro:"姜凜的雙胞胎弟弟，長得幾乎一模一樣，笑起來比哥哥危險。表面沉穩，其實比哥哥張揚，帶點瘋批與惡趣味，越危險越興奮，但非常清楚自己在做什麼。比哥哥愛說話，很快就對她有好感；最喜歡她稱讚他帥，會故意在她面前多晃幾次。實際上是愛撒嬌、愛找她聊天的大型危險犬。" }
];

var DEFAULT_SETTINGS = {
  replyLen: "short", chapterMode: true, chatBgOn: false,
  speakerBgOn: true, dispMode: "bubble", model: ""
};

var STORY_RULES = {

/* ===================== localStorage（含 try/catch） ===================== */
var storageWarned = false;
function lsGet(key, fallback){
  try{
    var v = localStorage.getItem(key);
    return v == null ? fallback : JSON.parse(v);
  }catch(e){
    if(!storageWarned){ storageWarned = true; showToast("儲存空間讀取失敗，本次變更不會保留"); }
    return fallback;
  }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){
    if(!storageWarned){ storageWarned = true; showToast("儲存空間寫入失敗，本次變更不會保留"); }
    return false;
  }
}

/* ===================== IndexedDB 圖片儲存 ===================== */
var idbPromise = null;
function idbOpen(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise(function(resolve, reject){
    try{
      var req = indexedDB.open("storyChatImages", 1);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains("images")) db.createObjectStore("images");
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    }catch(e){ reject(e); }
  });
  idbPromise.catch(function(){ showToast("圖片庫無法使用，頭像與背景將不保存"); });
  return idbPromise;
}
function idbPut(key, blob){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction("images", "readwrite");
      tx.objectStore("images").put(blob, key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ reject(tx.error); };
    });
  }).catch(function(){ showToast("圖片儲存失敗"); return false; });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction("images", "readonly");
      var req = tx.objectStore("images").get(key);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
  }).catch(function(){ return null; });
}
function idbDelete(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction("images", "readwrite");
      tx.objectStore("images").delete(key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ reject(tx.error); };
    });
  }).catch(function(){ return false; });
}
var blobUrlCache = {};
function blobUrl(key, blob){
  if(blobUrlCache[key]) URL.revokeObjectURL(blobUrlCache[key]);
  blobUrlCache[key] = URL.createObjectURL(blob);
  return blobUrlCache[key];
}

/* ===================== 圖片上傳（縮到長邊 1280、JPEG 0.85） ===================== */
var pickTarget = null;
function pickImage(target){
  pickTarget = target;
  $("filePicker").value = "";
  $("filePicker").click();
}
function processImageFile(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement("canvas");
        var max = 1280, w = img.width, h = img.height;
        var scale = Math.min(1, max / Math.max(w, h));
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(b){ b ? resolve(b) : reject(new Error("轉檔失敗")); }, "image/jpeg", 0.85);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function friendlyApiError(status, fallback){
  if(status === 400) return "金鑰錯誤（400）：請確認 API 金鑰是否複製完整。";
  if(status === 403) return "金鑰無效或沒有權限（403）：請到 aistudio.google.com 重新取得金鑰。";
  if(status === 429) return "免費額度已用完（429）：請稍後再試，或到 AI Studio 確認配額。";
  if(status === 0 || status === "network") return "網路錯誤：請確認網路連線後再試。";
  return fallback || ("發生錯誤（" + status + "），請稍後再試。");
}

function fetchModelList(key){
  return fetch(API_BASE + "/v1beta/models?key=" + encodeURIComponent(key))
    .then(function(res){
      if(!res.ok) throw { status: res.status };
      return res.json();
    })
    .then(function(data){
      var list = (data.models || []).filter(function(m){
        var methods = m.supportedGenerationMethods || [];
        return methods.indexOf("generateContent") >= 0;
      }).map(function(m){ return (m.name || "").replace(/^models\//, ""); });
      list.sort();
      return list;
    });
}

function loadModels(key){
  return fetchModelList(key).then(function(list){
    lsSet(LS.models, list);
    var settings = getSettings();
    if(!settings.model || list.indexOf(settings.model) < 0){
      var pick = pickDefaultModel(list);
      settings.model = pick || (list[0] || "");
      saveSettings(settings);
    }
    fillModelSelect();
    return list;
  });
}

function pickDefaultModel(list){
  var cands = list.filter(function(n){
    var lower = n.toLowerCase();
    return lower.indexOf("flash") >= 0 &&
      lower.indexOf("lite") < 0 && lower.indexOf("image") < 0 &&
      lower.indexOf("tts") < 0 && lower.indexOf("live") < 0;
  });
  return cands.length ? cands[cands.length - 1] : "";
}

function fillModelSelect(){
  var list = lsGet(LS.models, []) || [];
  var sel = $("modelSelect");
  sel.innerHTML = "";
  if(!list.length){
    var opt = document.createElement("option");
    opt.textContent = "（尚未連線，請先設定金鑰）";
    sel.appendChild(opt);
    return;
  }
  var settings = getSettings();
  list.forEach(function(name){
    var opt = document.createElement("option");
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.value = settings.model || list[0];
}

/* ===================== 生成呼叫 ===================== */
function buildContents(chat){
  var turns = chat.turns.slice(-60);
  return turns.map(function(t){
    return { role: t.role === "user" ? "user" : "model",
             parts: [{ text: t.text }] };
  });
}

function callGenerate(chat){
  var key = getApiKey();
  var settings = getSettings();
  var url = API_BASE + "/v1beta/models/" + encodeURIComponent(settings.model) + ":generateContent?key=" + encodeURIComponent(key);
  var body = {
    systemInstruction: { parts: [{ text: buildSystemInstruction() }] },
    contents: buildContents(chat),
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: getResponseSchema()
    }
  };
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function(res){
    if(!res.ok){
      return res.json().catch(function(){ return {}; }).then(function(err){
        var status = (err && err.error && err.error.code) || res.status;
        throw { status: status };
      });
    }
    return res.json();
  }).then(function(data){
    var text = "";
    try{
      var cand = data.candidates && data.candidates[0];
      text = cand.content.parts.map(function(p){ return p.text; }).join("");
    }catch(e){ throw { status: "parse" }; }
    return text;
  });
}

function parseModelJson(text){
  try{ return JSON.parse(text); }
  catch(e){
    var m = text.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); }catch(e2){} }
    throw { status: "parse" };
  }
}

function generateForChat(chat){
  return callGenerate(chat).then(function(text){
    try{ return parseModelJson(text); }
    catch(e){ return callGenerate(chat).then(parseModelJson); }
  });
}

/* ===================== 聊天流程 ===================== */
function createNewChat(autoOpening){
  var chat = {
    id: uid(), title: "新聊天", chapter: "第一章 開始上班啦",
    date: "", time: "", place: "宅邸", focus: "",
    turns: [], suggestions: [], createdAt: Date.now()
  };
  saveChat(chat);
  setActiveId(chat.id);
  renderAll();
  if(autoOpening !== false) sendOpening();
  return chat;
}

function startBranchChat(){
  var cur = getActiveChat();
  if(!cur){ showToast("目前沒有可分支的聊天"); return; }
  var copy = JSON.parse(JSON.stringify(cur));
  copy.id = uid();
  copy.title = (cur.title || "聊天") + "・分支";
  copy.createdAt = Date.now();
  saveChat(copy);
  setActiveId(copy.id);
  renderAll();
  showToast("已建立分支");
}

function sendOpening(){
  var chat = getActiveChat();
  if(!chat) return;
  var opening = "【開場】請產生第一章「開始上班啦」的開場：女主角剛搬進宅邸的第一個晚上。她整理完行李，第一次獨自待在偌大的宅邸；請安排環境敘述、一位角色短暫現身或傳訊息，並在結尾留下讓她必須回應的事件。注意：不要替女主角說話或行動。";
  chat.turns.push({ role: "user", text: opening });
  saveChat(chat);
  requestModelTurn(chat, true);
}

function sendUserMessage(text){
  var chat = getActiveChat();
  if(!chat) chat = createNewChat(true);
  text = (text || "").trim();
  if(!text) return;
  chat.turns.push({ role: "user", text: text });
  saveChat(chat);
  $("userInput").value = "";
  renderAll();
  requestModelTurn(chat, false);
}

function requestModelTurn(chat, isOpening){
  showTyping(true);
  var promise = MOCK ? Promise.resolve(mockGenerate()) : generateForChat(chat);
  promise.then(function(result){
    var json;
    if(typeof result === "string"){
      try{ json = parseModelJson(result); }
      catch(e){ json = null; }
    } else json = result;

    if(json){
      chat.turns.push({ role: "model", text: typeof result === "string" ? result : JSON.stringify(result) });
      applyModelJson(chat, json);
      if(isOpening && chat.turns.length <= 2) chat.title = chat.chapter || "第一章 開始上班啦";
    }else{
      chat.turns.push({ role: "model", text: typeof result === "string" ? result : JSON.stringify(result), raw: true });
      chat.suggestions = [];
    }
    saveChat(chat);
    renderAll();
  }).catch(function(err){
    var status = err && err.status;
    if(status === "parse"){
      showToast("模型回傳格式無法解析，已顯示原文");
    }else{
      showToast(friendlyApiError(status));
    }
    if(chat.turns.length && chat.turns[chat.turns.length-1].role === "user" && isOpening){
      /* 開場失敗保留回合，讓使用者可重試 */
    }
  }).finally(function(){
    showTyping(false);
  });
}

function applyModelJson(chat, json){
  chat.chapter = json.chapter || chat.chapter;
  chat.date = json.date || chat.date;
  chat.time = json.time || chat.time;
  chat.place = json.place || chat.place;
  chat.focus = json.focus || "";
  var sug = (json.suggestions || []).slice(0, 3);
  while(sug.length < 3) sug.push("……（自由輸入回應）");
  chat.suggestions = sug;
}

function regenerateLast(){
  var chat = getActiveChat();
  if(!chat || !chat.turns.length) return;
  while(chat.turns.length && chat.turns[chat.turns.length-1].role === "model"){
    chat.turns.pop();
  }
  if(!chat.turns.length) return;
  saveChat(chat);
  renderAll();
  requestModelTurn(chat, false);
}

function showTyping(on){

function scrollChatToBottom(){

function charByName(name){
  for(var i=0;i<CHARACTERS.length;i++) if(CHARACTERS[i].name === name) return CHARACTERS[i];
  return null;
}

function renderAll(){
  renderHeader();

}

function renderHeader(){
  var chat = getActiveChat();
  $("chapterName").textContent = chat ? (chat.chapter || "宅邸物語") : "宅邸物語";
  var parts = [];
  if(chat){
    if(chat.date) parts.push("📅 " + chat.date);

function getAvatarHtml(speaker){
  var c = charByName(speaker);
  var key = c ? "char_" + c.id + "_avatar" : "profile_avatar";
  if(blobUrlCache[key]){
    return '<img class="avatar" src="' + blobUrlCache[key] + '" alt="">';
  }
  var label = c ? c.name.charAt(0) : "許";
  return '<div class="avatar">' + esc(label) + '</div>';
}

function renderChat(){
  var chat = getActiveChat();
  var box = $("chat");
  box.innerHTML = "";
  var settings = getSettings();
  box.className = settings.dispMode === "plain" ? "chat-mode-plain" : "chat-mode-bubble";
  if(!chat){
    box.innerHTML = '<div class="msg-sys">尚無聊天。點右上角選單 →「聊天管理」開始新聊天。</div>';
    return;
  }
  var lastModelIndex = -1;
  for(var i=0;i<chat.turns.length;i++) if(chat.turns[i].role === "model") lastModelIndex = i;

  chat.turns.forEach(function(turn, idx){
    if(turn.role === "user"){
      var opening = turn.text.indexOf("【開場】") === 0;
      if(opening){
        var sys = document.createElement("div");
        sys.className = "msg-sys"; sys.textContent = "—— 第一章 開始上班啦・第一晚 ——";
        box.appendChild(sys);
      }else{
        var u = document.createElement("div");
        u.className = "msg-user";
        u.textContent = turn.text;
        box.appendChild(u);
      }
      return;
    }
    var json = null;
    try{ json = JSON.parse(turn.text); }catch(e){ json = null; }
    if(!json || !json.segments){
      var raw = document.createElement("div");
      raw.className = "msg-raw";
      raw.textContent = "（模型回傳原文）\n" + turn.text;
      box.appendChild(raw);
    }else{
      if(idx === lastModelIndex && json.chapter){
        var ch = document.createElement("div");
        ch.className = "msg-sys"; ch.textContent = "—— " + json.chapter + " ——";
        box.appendChild(ch);
      }
      json.segments.forEach(function(seg){
        box.appendChild(renderSegment(seg));
      });
    }
  });

  if(lastModelIndex >= 0){
    var btn = document.createElement("button");
    btn.id = "reRoll"; btn.textContent = "換一個版本";
    btn.addEventListener("click", regenerateLast);
    box.appendChild(btn);
  }
  scrollChatToBottom();
}

function renderSegment(seg){
  var div = document.createElement("div");
  if(seg.type === "line"){
    div.className = "msg-line";
    div.innerHTML = getAvatarHtml(seg.speaker) +
      '<div class="bubble-wrap"><div class="speaker-name">' + esc(seg.speaker || "？") + '</div>' +
      '<div class="bubble">' + italics(seg.text) + '</div></div>';
  }else if(seg.type === "message"){
    div.className = "msg-msg";
    div.innerHTML = '<div class="phone-card"><div class="phone-head">📱 訊息・' + esc(seg.speaker || "？") + '</div>' +
      '<span class="phone-text">' + italics(seg.text) + '</span></div>';
  }else{
    div.className = "msg-narr";
    div.innerHTML = italics(seg.text);
  }
  div._seg = seg;
  div.addEventListener("pointerdown", function(){ onSegPointerDown(seg, div); });
  div.addEventListener("pointerup", onSegPointerUp);
  div.addEventListener("pointerleave", onSegPointerUp);
  div.addEventListener("click", function(){ onSegClick(seg, div); });
  return div;
}

function renderSuggestions(){
  var chat = getActiveChat();
  var row = $("suggestRow");
  row.innerHTML = "";
  if(!chat || !chat.suggestions || !chat.suggestions.length) return;
  chat.suggestions.forEach(function(s){
    var b = document.createElement("button");
    b.className = "sug-btn";

function renderChatList(){

  list.innerHTML = "";

  order.forEach(function(id){

/* ===================== 聊天背景 / 說話者背景 ===================== */
function applyChatBackground(){
  var chat = getActiveChat();
  var settings = getSettings();
  var wrap = $("chatWrap");
  var url = "", overlay = "rgba(8,12,26,.78)";
  if(settings.speakerBgOn && chat && chat.focus){
    var c = charByName(chat.focus);
    var key = c ? "char_" + c.id + "_bg" : "";
    if(key && blobUrlCache[key]){ url = blobUrlCache[key]; overlay = "rgba(8,12,26,.62)"; }
  }
  if(!url && settings.chatBgOn && blobUrlCache["chat_bg"]){
    url = blobUrlCache["chat_bg"];
  }
  wrap.style.transition = "background-image .6s ease";
  wrap.style.backgroundImage = url ? 'url("' + url + '")' : "none";
  wrap.style.setProperty("--overlay", overlay);
  var before = wrap.querySelector("style");
  /* 用 CSS 變數調整遮罩 */
  var styleEl = document.getElementById("overlayStyle");
  if(!styleEl){
    styleEl = document.createElement("style");
    styleEl.id = "overlayStyle";
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = "#chatWrap::before{background:" + overlay + " !important;}";
}

function refreshBlobCache(){
  var jobs = [];
  CHARACTERS.forEach(function(c){
    ["avatar", "bg"].forEach(function(kind){
      var key = "char_" + c.id + "_" + kind;
      jobs.push(idbGet(key).then(function(b){ if(b) blobUrlCache[key] = URL.createObjectURL(b); }));
    });
  });
  ["chat_bg", "profile_avatar"].forEach(function(key){
    jobs.push(idbGet(key).then(function(b){ if(b) blobUrlCache[key] = URL.createObjectURL(b); }));
  });
  return Promise.all(jobs);
}

var quoteTargetSeg = null;
function onLineClick(seg, el){
  quoteTargetSeg = seg;
  var pop = $("quotePop");
  pop.classList.remove("hidden");
  clearTimeout(pop._timer);
  pop._timer = setTimeout(function(){ pop.classList.add("hidden"); }, 3000);
}
function makeQuoteCard(){
  var pop = $("quotePop");
  pop.classList.add("hidden");
  var seg = quoteTargetSeg;
  if(!seg){ showToast("請先點選一句角色台詞"); return; }
  var canvas = $("quoteCanvas");
  var W = 900, H = 1350;
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d");
  var grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#141c38"); grad.addColorStop(1, "#0b1020");
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#d8b36a"; ctx.lineWidth = 6;
  ctx.strokeRect(40, 40, W - 80, H - 80);

  var c = charByName(seg.speaker);
  var key = c ? "char_" + c.id + "_avatar" : "";
  var drawText = function(){
    ctx.fillStyle = "#f0d9a8";
    ctx.font = "bold 44px 'PingFang TC', sans-serif";
    ctx.textAlign = "center";
    var text = seg.text || "";
    var lines = wrapCanvasText(ctx, text, W - 200);
    var startY = H / 2 - (lines.length * 62) / 2 + 40;
    lines.forEach(function(line, i){
      ctx.fillText(line, W / 2, startY + i * 62);
    });
    ctx.fillStyle = "#d8b36a";
    ctx.font = "36px 'PingFang TC', sans-serif";
    ctx.fillText("── " + (seg.speaker || "") + " ──", W / 2, H - 160);
    ctx.fillStyle = "#9aa3bd";
    ctx.font = "24px sans-serif";
    ctx.fillText("宅邸物語", W / 2, H - 110);
    shareQuoteCanvas(canvas);
  };
  if(key && blobUrlCache[key]){
    var img = new Image();
    img.onload = function(){
      ctx.save();
      ctx.beginPath(); ctx.arc(W/2, 300, 110, 0, Math.PI*2); ctx.closePath(); ctx.clip();
      ctx.drawImage(img, W/2-110, 300-110, 220, 220);
      ctx.restore();
      ctx.strokeStyle = "#d8b36a"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(W/2, 300, 112, 0, Math.PI*2); ctx.stroke();
      drawText();
    };
    img.onerror = drawText;
    img.src = blobUrlCache[key];
  }else{
    ctx.fillStyle = "#1a2447";
    ctx.beginPath(); ctx.arc(W/2, 300, 110, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#d8b36a";
    ctx.font = "bold 90px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText((seg.speaker || "？").charAt(0), W/2, 335);
    drawText();
  }
}
function wrapCanvasText(ctx, text, maxW){
  var chars = String(text).split("");
  var lines = [], cur = "";
  chars.forEach(function(ch){
    if(ctx.measureText(cur + ch).width > maxW && cur){ lines.push(cur); cur = ch; }
    else cur += ch;
  });
  if(cur) lines.push(cur);
  return lines;
}
function shareQuoteCanvas(canvas){
  canvas.toBlob(function(blob){
    if(!blob){ showToast("圖卡產生失敗"); return; }
    var file = new File([blob], "quote.png", { type: "image/png" });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: "名言卡" }).catch(function(){});
      return;
    }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "quote.png";
    a.click();
    showToast("已下載 PNG");
  }, "image/png");
}

function loadImg(src){
  return new Promise(function(resolve){
    if(!src){ resolve(null); return; }
    var img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ resolve(null); };
    img.src = src;
  });
}
function cardFontPx(px, italic){
  return (italic ? "italic " : "") + px + "px 'PingFang TC','Microsoft JhengHei',sans-serif";
}
function richWrap(ctx, text, maxW, px){
  var parts = String(text == null ? "" : text).split(/(\*[^*\n]+\*)/);
  var lines = [], cur = [], curW = 0;
  parts.forEach(function(p){
    var italic = p.length > 2 && p.charAt(0) === "*" && p.charAt(p.length - 1) === "*";
    var body = italic ? p.slice(1, -1) : p;
    ctx.font = cardFontPx(px, italic);
    body.split("").forEach(function(ch){
      var w = ctx.measureText(ch).width;
      if(curW + w > maxW && cur.length){ lines.push(cur); cur = []; curW = 0; }
      cur.push({ ch: ch, italic: italic });
      curW += w;
    });
  });
  if(cur.length) lines.push(cur);
  return lines;
}
function drawRichLines(ctx, lines, x, y, px, lineH, color){
  ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillStyle = color;
  var cy = y;
  lines.forEach(function(line){
    var cx = x;
    line.forEach(function(t){
      ctx.font = cardFontPx(px, t.italic);
      ctx.fillText(t.ch, cx, cy);
      cx += ctx.measureText(t.ch).width;
    });
    cy += lineH;
  });
  return cy;
}
function makeMessageCards(segs){
  var W = 1080, PAD = 72;
  var canvas = document.createElement("canvas");
  canvas.width = W;
  var ctx = canvas.getContext("2d");
  var px = 34, lineH = 52, avR = 46;

  var blocks = segs.map(function(seg){
    var name = (seg.speaker || "旁白");
    var maxW = W - PAD * 2 - (avR * 2 + 28);
    var lines = richWrap(ctx, seg.text, maxW, px);
    var textH = Math.max(lineH, lines.length * lineH);
    return { seg: seg, name: name, lines: lines, h: Math.max(avR * 2, textH) + 60 };
  });
  var H = PAD * 2 + blocks.reduce(function(a, b){ return a + b.h; }, 0) + 100;
  canvas.height = H;

  var grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#141c38"); grad.addColorStop(1, "#0b1020");
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#d8b36a"; ctx.lineWidth = 5;
  ctx.strokeRect(36, 36, W - 72, H - 72);

  var drawContent = function(avatars){
    var y = PAD + 10;
    blocks.forEach(function(b, i){
      var cx = PAD, cy = y;
      ctx.save();
      ctx.beginPath(); ctx.arc(cx + avR, cy + avR, avR, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
      var img = avatars[i];
      if(img){ ctx.drawImage(img, cx, cy, avR * 2, avR * 2); }
      else{ ctx.fillStyle = "#1a2447"; ctx.fillRect(cx, cy, avR * 2, avR * 2); }
      ctx.restore();
      ctx.strokeStyle = "#d8b36a"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx + avR, cy + avR, avR, 0, Math.PI * 2); ctx.stroke();
      if(!img){
        ctx.fillStyle = "#d8b36a";
        ctx.font = "bold 40px 'PingFang TC','Microsoft JhengHei',sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(b.name.charAt(0), cx + avR, cy + avR + 2);
      }
      ctx.fillStyle = "#d8b36a";
      ctx.font = "bold 30px 'PingFang TC','Microsoft JhengHei',sans-serif";
      ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText(b.name, cx + avR * 2 + 28, cy + 2);
      drawRichLines(ctx, b.lines, cx + avR * 2 + 28, cy + 50, px, lineH, "#e8e6df");
      y += b.h;
    });
    ctx.fillStyle = "#9aa3bd";
    ctx.font = "26px 'PingFang TC','Microsoft JhengHei',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText("這爽缺我賴定了", W / 2, H - 52);
    showCardPreview(canvas);
  };

  var jobs = segs.map(function(seg){
    var c = charByName(seg.speaker);
    var key = c ? "char_" + c.id + "_avatar" : "";
    return loadImg(key && blobUrlCache[key] ? blobUrlCache[key] : "");
  });
  Promise.all(jobs).then(function(avatars){
    var bgSrc = cardBgSource();
    if(!bgSrc){ drawContent(avatars); return; }
    loadImg(bgSrc).then(function(bg){
      if(bg){
        var s = Math.max(W / bg.width, H / bg.height);
        var dw = bg.width * s, dh = bg.height * s;
        ctx.drawImage(bg, (W - dw) / 2, (H - dh) / 2, dw, dh);
        ctx.fillStyle = "rgba(8,12,26,.78)";
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "#d8b36a"; ctx.lineWidth = 5;
        ctx.strokeRect(36, 36, W - 72, H - 72);
      }
      drawContent(avatars);
    });
  });
}
function showCardPreview(canvas){
  canvas.toBlob(function(blob){
    if(!blob){ showToast("卡片產生失敗"); return; }
    cardLastBlob = blob;
    $("cardPreviewImg").src = URL.createObjectURL(blob);
    var canShare = false;
    if(navigator.canShare){
      try{
        canShare = navigator.canShare({ files: [new File([blob], "card.png", { type: "image/png" })] });
      }catch(e){ canShare = false; }
    }
    $("cardShareBtn").classList.toggle("hidden", !canShare);
    $("cardPreviewModal").classList.remove("hidden");
  }, "image/png");
}
function bindCardUI(){
  $("cardMsgMenuBtn").addEventListener("click", enterCardPickMode);
  $("cardPop").addEventListener("click", makeCardFromPop);
  $("cardDoneBtn").addEventListener("click", finishCardPick);
  $("cardCancelBtn").addEventListener("click", function(){ exitCardPickMode(); });
  $("cardShareBtn").addEventListener("click", function(){
    if(!cardLastBlob) return;
    var file = new File([cardLastBlob], "card.png", { type: "image/png" });
    if(navigator.share){
      navigator.share({ files: [file], title: "訊息卡片" }).catch(function(){});
    }
  });
  $("cardSaveBtn").addEventListener("click", function(){
    if(!cardLastBlob) return;
    var a = document.createElement("a");
    a.href = URL.createObjectURL(cardLastBlob);
    a.download = "card.png";
    a.click();
    showToast("已下載 PNG");
  });
  $("cardCloseBtn").addEventListener("click", function(){ $("cardPreviewModal").classList.add("hidden"); });
  $("cardPreviewModal").addEventListener("click", function(e){
    if(e.target === this) this.classList.add("hidden");
  });
}

/* ===================== 檔案選擇處理 ===================== */
function bindFilePicker(){
  $("filePicker").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(!f || !pickTarget) return;
    processImageFile(f).then(function(blob){
      if(pickTarget.kind === "char"){
        var key = "char_" + pickTarget.id + "_" + pickTarget.type;
        return idbPut(key, blob).then(function(){
          blobUrlCache[key] = URL.createObjectURL(blob);
          showToast("圖片已儲存");
          renderCharCards(); applyChatBackground();
        });
      }
      if(pickTarget.kind === "chatBg"){
        return idbPut("chat_bg", blob).then(function(){
          blobUrlCache["chat_bg"] = URL.createObjectURL(blob);
          var s = getSettings(); s.chatBgOn = true; saveSettings(s);
          showToast("聊天背景已更新");
          applyChatBackground(); fillSettingsPanel();
        });
      }
      if(pickTarget.kind === "profile"){
        return idbPut("profile_avatar", blob).then(function(){
          blobUrlCache["profile_avatar"] = URL.createObjectURL(blob);
          showToast("頭像已更新");
          fillProfilePanel(); renderChat();
        });
      }
    }).catch(function(){
      showToast("圖片處理失敗");
    });
  });
}

/* ===================== 金鑰流程 ===================== */
function bindKeyModal(){
  $("keySaveBtn").addEventListener("click", function(){
    var key = $("keyInput").value.trim();
    if(!key){ $("keyErr").textContent = "請先貼上金鑰。"; $("keyErr").classList.remove("hidden"); return; }
    $("keySaveBtn").textContent = "連線中…";
    loadModels(key).then(function(){
      saveApiKey(key);
      hideKeyModal();
      $("keySaveBtn").textContent = "儲存並連線";
      showToast("金鑰已儲存，模型列表已更新");
      var chat = getActiveChat();
      if(!chat || !chat.turns.length) createNewChat(true);
    }).catch(function(err){
      $("keySaveBtn").textContent = "儲存並連線";
      $("keyErr").textContent = friendlyApiError(err && err.status);
      $("keyErr").classList.remove("hidden");
    });
  });
}

/* ===================== 啟動 ===================== */
function bindUI(){
  $("sendBtn").addEventListener("click", function(){ sendUserMessage($("userInput").value); });
  $("userInput").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendUserMessage(this.value); }
  });
  $("menuBtn").addEventListener("click", openDrawer);
  $("drawerClose").addEventListener("click", closeDrawer);
  $("drawerMask").addEventListener("click", closeDrawer);
  document.querySelectorAll(".menu-item").forEach(function(btn){
    btn.addEventListener("click", function(){ showPanel(btn.getAttribute("data-panel")); });
  });
  document.querySelectorAll("[data-back]").forEach(function(btn){
    btn.addEventListener("click", function(){ showPanel(null); });
  });
  $("memorySaveBtn").addEventListener("click", saveMemoryFromPanel);
  $("memoryDraftBtn").addEventListener("click", requestMemoryDraft);
  $("memoryText").addEventListener("input", function(){
    $("memoryCount").textContent = this.value.length + " 字";
  });
  $("profileSaveBtn").addEventListener("click", saveProfileFromPanel);
  $("profileAvatarBtn").addEventListener("click", function(){ pickImage({ kind: "profile" }); });
  $("quotePop").addEventListener("click", makeQuoteCard);
  $("quoteTryBtn").addEventListener("click", function(){
    showToast("回到聊天區，點任何一句角色台詞即可做卡");
    closeDrawer();
  });
  bindSettingsPanel();
  bindChatsPanel();
  bindFilePicker();
  bindKeyModal();
  bindCardUI();
}

function init(){
  bindUI();
  refreshBlobCache().then(function(){
    applyChatBackground();
    renderAll();
  });
  if(MOCK){
    showToast("測試模式：不呼叫 API、不需要金鑰");
    var chat = getActiveChat();
    if(!chat || !chat.turns.length) createNewChat(true);
    else renderAll();
    return;
  }
  var key = getApiKey();
  if(!key){
    showKeyModal();
    return;
  }
  fillModelSelect();
  var chat = getActiveChat();
  if(!chat || !chat.turns.length) createNewChat(true);
  else renderAll();
}

document.addEventListener("DOMContentLoaded", init);
</script>
